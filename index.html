<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awais Gym</title>
<meta name="theme-color" content="#0B0D0B">
<meta name="description" content="Personal gym program and workout tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Awais Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<link rel="icon" id="faviconLink" href="app-icon-192.png">
<link rel="apple-touch-icon" id="touchIconLink" href="app-icon-192.png">
<style>
/* Layout: sidebar rail (desktop) / icon rail (tablet) / bottom glass bar (phone); content column max 1180px.
   Single committed dark look built around the user's lime icon pack, with one light "now" surface. */
:root{
  color-scheme: dark;
  --bg:#0B0D0B;           /* graphite with a green bias */
  --bg-2:#111511;
  --surface:rgba(236,244,230,.045);
  --surface-2:rgba(236,244,230,.075);
  --line:rgba(226,240,214,.09);
  --line-2:rgba(226,240,214,.16);
  --text:#EEF3EA;
  --muted:#8E978A;
  --faint:#5D6559;
  --lime:#C1FF72;         /* sampled from the provided icons */
  --lime-ink:#0E1405;
  --lime-soft:rgba(193,255,114,.12);
  --paper:#ECEFE6;        /* light surface */
  --paper-ink:#121510;
  --paper-muted:#5F665A;
  --warn:#FFB86B;
  --font-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --blur:saturate(150%) blur(22px);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -20px rgba(0,0,0,.6);
  --ease:cubic-bezier(.2,.8,.2,1);
  --side:248px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* ambient backdrop — gives the glass something to refract */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.ambient i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,rgba(193,255,114,.20),transparent 65%)}
.ambient i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:30vh;background:radial-gradient(circle,rgba(120,160,110,.16),transparent 65%)}
.ambient i:nth-child(3){width:36vmax;height:36vmax;left:30vw;bottom:-22vmax;background:radial-gradient(circle,rgba(193,255,114,.08),transparent 65%)}
.ambient::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.25;mask-image:radial-gradient(ellipse at 30% 0%,#000 0%,transparent 70%)}

/* ---------- Navigation ---------- */
.shell{position:relative;z-index:1;min-height:100%}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side);padding:28px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px;background:rgba(14,17,14,.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;padding:0 8px}
.brand img{width:56px;height:56px;border-radius:16px;background:#000;padding:5px;border:1px solid var(--line-2);object-fit:contain;image-rendering:auto}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:14px;color:var(--muted);font-weight:600;transition:background .25s var(--ease),color .25s}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.on{background:var(--lime-soft);color:var(--text);box-shadow:inset 0 0 0 1px rgba(193,255,114,.22)}
.nicon{width:22px;height:22px;flex:none;display:grid;place-items:center}
.nicon img{width:22px;height:22px;object-fit:contain;filter:grayscale(1) brightness(1.5);opacity:.55;transition:.25s}
.nicon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on .nicon img{filter:none;opacity:1}
.nav a.on .nicon svg{stroke:var(--lime)}
.side-install{margin-top:auto}
.side-install+.side-foot{margin-top:12px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.side-foot .who b{display:block;font-size:14px}
.side-foot .who span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.avatar{position:relative;flex:none;width:44px;height:44px}
.avatar img.photo{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;object-fit:cover}
.avatar img.ring{position:absolute;inset:0;width:100%;height:100%}

.mtop{display:none}
.mnav{display:none}

.main{margin-left:var(--side);padding:36px 40px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- Typography ---------- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--font-display);font-stretch:118%;font-weight:750;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.01em;line-height:1.05}
.h2{font-family:var(--font-display);font-stretch:112%;font-weight:700;font-size:20px;letter-spacing:0}
.h3{font-weight:700;font-size:16px}
.muted{color:var(--muted)}
.num{font-family:var(--font-display);font-stretch:125%;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:56ch}

/* ---------- Surfaces ---------- */
.glass{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.panel{padding:22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.grid{display:grid;gap:18px}

/* ---------- Page animation ---------- */
.page{animation:pageIn .45s var(--ease) both}
@keyframes pageIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger>*{animation:pageIn .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(7){animation-delay:.24s}.stagger>*:nth-child(8){animation-delay:.28s}

/* ---------- Buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface-2);border:1px solid var(--line-2);transition:transform .15s var(--ease),background .25s}
.btn:hover{background:rgba(236,244,230,.11)}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.btn.lime:hover{background:#CDFF8C}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--lime-soft);color:var(--lime)}
.chip.outline{background:transparent;border:1px solid var(--line-2);color:var(--text)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumbs a:hover{color:var(--text)}
.crumbs span.sep{opacity:.4}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:12px}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.now{grid-column:span 7;background:var(--paper);color:var(--paper-ink);border-radius:var(--r-lg);padding:26px 28px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden;min-height:260px}
.now::after{content:"";position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;border-radius:50%;border:38px solid rgba(18,21,16,.05)}
.now-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.now-greet{display:flex;align-items:center;gap:12px}
.now-greet .avatar{width:52px;height:52px}
.now-greet b{display:block;font-weight:800;font-size:16px}
.now-greet span{font-size:13px;color:var(--paper-muted)}
.now .tag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--paper-ink);color:var(--lime)}
.clock{display:flex;align-items:flex-end;gap:10px;line-height:.85;margin-top:auto}
.clock .t{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:clamp(64px,8.4vw,112px);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.clock .ap{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.clock .ap b{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:22px}
.clock .ap span{font-family:var(--font-display);font-stretch:112%;font-weight:600;font-size:15px;color:var(--paper-muted);font-variant-numeric:tabular-nums}
.date-line{font-weight:700;font-size:18px;position:relative;z-index:1}
.date-line span{color:var(--paper-muted);font-weight:600}

.ringcard{grid-column:span 5;display:flex;align-items:center;gap:24px;padding:26px}
.ring{position:relative;width:168px;height:168px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:rgba(236,244,230,.08)}
.ring .val{stroke:var(--lime);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-size:40px;line-height:1}
.ring .lbl span{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.ringcard .side{display:flex;flex-direction:column;gap:14px;min-width:0}
.ringcard .side p{margin:0;color:var(--muted);font-size:14px}

.stat{grid-column:span 3;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ico{width:34px;height:34px;border-radius:10px;background:var(--lime-soft);display:grid;place-items:center}
.stat .ico img{width:20px;height:20px;object-fit:contain}
.stat .ico svg{width:18px;height:18px;stroke:var(--lime);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-size:32px;line-height:1}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px;font-family:var(--font-body)}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}

.activity{grid-column:span 7}
.quick{grid-column:span 5}
.feed{display:flex;flex-direction:column}
.feed-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.feed-row:first-child{border-top:0;padding-top:0}
.feed-row .fi{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.feed-row .fi img{width:26px;height:26px;object-fit:contain}
.feed-row .ft{flex:1;min-width:0}
.feed-row .ft b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-row .ft span{font-size:12px;color:var(--muted)}
.feed-row .fv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 12px;color:var(--muted)}
.empty img{width:56px;height:56px;opacity:.75}
.empty b{color:var(--text);font-size:15px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:.25s var(--ease);position:relative}
.qtile:hover{border-color:var(--line-2);transform:translateY(-2px)}
.qtile img{width:38px;height:38px;object-fit:contain}
.qtile span{font-size:12px;font-weight:700}
.qtile .mini{width:70%;height:3px;border-radius:3px;background:rgba(236,244,230,.08);overflow:hidden}
.qtile .mini i{display:block;height:100%;background:var(--lime);border-radius:3px;transition:width .8s var(--ease)}

/* quote */
.dash>*{order:5}
.dash>.now{order:1}.dash>.ringcard{order:2}.dash>.quote{order:3}
.quote{grid-column:span 12;display:flex;align-items:center;gap:22px;padding:22px 26px;position:relative;overflow:hidden}
.quote .qm{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:64px;line-height:.6;color:var(--lime);padding-top:18px;flex:none}
.quote .qbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.quote .qtext{font-family:var(--font-display);font-stretch:112%;font-weight:650;font-size:clamp(19px,2vw,24px);line-height:1.25;text-wrap:balance;transition:opacity .55s var(--ease),filter .55s var(--ease),transform .55s var(--ease)}
.quote .qtext.out{opacity:0;filter:blur(6px);transform:translateY(-6px)}
.quote .qtext.pre{opacity:0;filter:blur(6px);transform:translateY(8px);transition:none}
.quote .qmeta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.quote .qline{flex:none;width:72px;height:2px;border-radius:2px;background:rgba(236,244,230,.1);overflow:hidden}
.quote .qline i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left;animation:qline 30s linear both}
@keyframes qline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* install */
.install{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 12px;border-radius:999px;font-weight:700;font-size:13px;background:var(--lime-soft);color:var(--text);border:1px solid rgba(193,255,114,.3);transition:background .25s,transform .15s}
.install:hover{background:rgba(193,255,114,.2)}
.install:active{transform:scale(.96)}
.install svg{width:16px;height:16px;stroke:var(--lime);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-install{width:100%;justify-content:center;height:44px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.steps li::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:13px}
.note{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.note b{color:var(--text)}

/* ---------- Program ---------- */
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.part{position:relative;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .35s var(--ease),border-color .3s,background .3s;overflow:hidden;isolation:isolate}
.part::before{content:"";position:absolute;inset:auto -30% -55% auto;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(193,255,114,.16),transparent 70%);opacity:0;transition:opacity .4s;z-index:-1}
.part:hover{transform:translateY(-4px);border-color:rgba(193,255,114,.3)}
.part:hover::before{opacity:1}
.part:active{transform:scale(.985)}
.part .art{aspect-ratio:1/1;border-radius:18px;background:linear-gradient(160deg,rgba(236,244,230,.06),rgba(236,244,230,.015));border:1px solid var(--line);display:grid;place-items:center}
.part .art img{width:58%;height:58%;object-fit:contain;transition:transform .5s var(--ease)}
.part:hover .art img{transform:scale(1.06)}
.part .meta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.part .meta .h2{font-size:21px}
.part .meta small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.part .idx{position:absolute;top:16px;left:18px;font-family:var(--font-display);font-stretch:125%;font-weight:700;font-size:11px;color:var(--faint);letter-spacing:.08em}
.bar{height:4px;border-radius:4px;background:rgba(236,244,230,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--lime);transition:width .9s var(--ease)}
.check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line-2)}
.check svg{width:14px;height:14px;stroke:var(--lime-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check.on{background:var(--lime);border-color:var(--lime)}
.check.on svg{opacity:1}

.part-hero{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.part-hero .pi{width:76px;height:76px;border-radius:22px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.part-hero .pi img{width:50px;height:50px;object-fit:contain}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.sec{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);transition:transform .35s var(--ease),border-color .3s}
.sec:hover{transform:translateY(-3px);border-color:rgba(193,255,114,.3)}
.sec .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec .pos{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:22px}
.sec .sub{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- Image slot ---------- */
.media{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border-radius:20px;overflow:hidden;background:#0F120F;border:1px solid var(--line)}
.media img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .6s var(--ease),transform .8s var(--ease)}
.media img.in{opacity:1;transform:none}
.ph{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border-radius:20px;overflow:hidden;background:
  radial-gradient(circle at 50% 42%,rgba(193,255,114,.07),transparent 60%),
  repeating-linear-gradient(135deg,rgba(236,244,230,.025) 0 12px,transparent 12px 24px),#0E110E;border:1px solid var(--line);display:grid;place-items:center}
.ph::before{content:"";position:absolute;inset:12px;border:1.5px dashed rgba(193,255,114,.22);border-radius:14px}
.ph .ph-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px}
.ph .ph-in img{width:34%;max-width:120px;aspect-ratio:1;object-fit:contain;opacity:.32}
.ph .ph-in b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);opacity:.85}
.ph .ph-in span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph.sm .ph-in{padding:8px;gap:6px}
.ph.sm .ph-in b{font-size:10.5px}
.ph.sm .ph-in span{display:none}
.ph.sm::before{inset:8px;border-radius:10px}

/* ---------- Exercise ---------- */
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;padding:22px}
.ex-info{display:flex;flex-direction:column;gap:20px;min-width:0}
.ex-tags{display:flex;gap:8px;flex-wrap:wrap}
.ex-name{font-family:var(--font-display);font-stretch:118%;font-weight:750;font-size:clamp(24px,2.6vw,32px);line-height:1.08}
.ex-name.pending{color:var(--muted)}
.ex-name-note{font-size:13px;color:var(--muted);margin-top:6px}
.complete{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left;transition:background .3s,border-color .3s,transform .15s}
.complete:active{transform:scale(.985)}
.complete .check{width:34px;height:34px}
.complete .check svg{width:18px;height:18px}
.complete b{display:block;font-size:16px}
.complete span{font-size:12.5px;color:var(--muted)}
.complete.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.complete.on span{color:rgba(14,20,5,.7)}
.complete.on .check{background:var(--lime-ink);border-color:var(--lime-ink)}
.complete.on .check svg{stroke:var(--lime)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label .lunit{display:none}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inp{display:flex;align-items:center;height:52px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line-2);transition:border-color .2s,background .2s;overflow:hidden}
.inp:focus-within{border-color:rgba(193,255,114,.55);background:rgba(0,0,0,.35)}
.inp input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;padding:0 14px;font-family:var(--font-display);font-stretch:112%;font-weight:650;font-size:18px;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--faint);font-weight:500}
.inp .unit{padding-right:12px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.inp .step{width:44px;height:100%;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line);font-size:20px;font-weight:500;flex:none}
.inp .step:first-child{border-left:0;border-right:1px solid var(--line)}
.inp .step:hover{color:var(--lime);background:var(--surface)}
textarea.notes{width:100%;min-height:84px;resize:vertical;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line-2);padding:12px 14px;outline:0;line-height:1.5}
textarea.notes:focus{border-color:rgba(193,255,114,.55)}
.timer{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line-2)}
.timer .tv{font-size:28px;flex:1}
.timer.run{border-color:rgba(193,255,114,.5)}
.timer.run .tv{color:var(--lime)}
.timer .tbtns{display:flex;gap:8px}
.hint{font-size:12px;color:var(--faint)}
.saved{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:opacity .3s}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--lime)}
.ex-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

/* walk */
.walk{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;padding:22px}
.walk .fields{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(5,7,5,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .25s ease both}
.modal .sheet{width:min(560px,100%);max-height:min(82vh,760px);overflow:auto;padding:24px;border-radius:var(--r-lg);background:rgba(22,26,22,.86);border:1px solid var(--line-2);box-shadow:0 40px 80px -20px rgba(0,0,0,.7);animation:pop .35s var(--ease) both}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.xbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}

/* ---------- Progress ---------- */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:.25s}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px}
.pstat{padding:18px 20px}
.pstat .v{font-size:30px;line-height:1.05}
.pstat .v small{font-size:13px;color:var(--muted);font-weight:600;font-family:var(--font-body);margin-left:3px}
.pstat .k{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
.pstat.feature{background:var(--paper);color:var(--paper-ink);border-color:transparent}
.pstat.feature .k,.pstat.feature .v small{color:var(--paper-muted)}
.pcharts{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--font-body);font-size:11px;font-weight:600}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart rect.b{fill:var(--lime)}
.chart rect.b0{fill:rgba(236,244,230,.08)}
.chart rect.hit{fill:transparent}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.hbars{display:flex;flex-direction:column;gap:14px}
.hbar .top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:7px}
.hbar .top .l{display:flex;align-items:center;gap:8px}
.hbar .top img{width:20px;height:20px;object-fit:contain}
.hbar .top span{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:70;pointer-events:none;padding:8px 10px;border-radius:10px;background:rgba(22,26,22,.95);border:1px solid var(--line-2);font-size:12px;font-weight:600;transform:translate(-50%,-110%);white-space:nowrap}

/* floating timer pill */
.pill{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 14px;border-radius:999px;background:rgba(18,22,18,.8);border:1px solid rgba(193,255,114,.4);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-weight:700;animation:pop .3s var(--ease) both}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:pulse 1.4s infinite}
.pill .num{font-size:16px;color:var(--lime)}
@keyframes pulse{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--paper);color:var(--paper-ink);font-weight:700;font-size:13.5px;box-shadow:0 20px 40px -10px rgba(0,0,0,.5);animation:toast 2.2s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}

/* ---------- Tablet: icon rail ---------- */
@media (max-width:1180px){
  .parts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pstats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1060px){
  :root{--side:88px}
  .sidebar{padding:22px 14px;align-items:center}
  .brand{padding:0}.brand img{width:48px;height:48px}.nav a span.lbl,.side-foot .who,.side-install .lbl{display:none}
  .nav a{justify-content:center;padding:12px}
  .side-foot{padding:6px;background:none;border:0}
  .main{padding:30px 28px 60px}
  .now,.ringcard,.activity,.quick{grid-column:span 12}
  .dash>.quote{order:2}.dash>.ringcard{order:3}
  .stat{grid-column:span 6}
  .pcharts{grid-template-columns:1fr}
  .ex,.walk{grid-template-columns:1fr 1fr;gap:22px}
}

/* ---------- Phone ---------- */
@media (max-width:720px){
  body{font-size:15px}
  .sidebar{display:none}
  .main{margin-left:0;padding:8px 16px calc(110px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px;position:sticky;top:0;z-index:30;margin:0 -16px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(11,13,11,.7);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
  .mtop .brand img{width:44px;height:44px;border-radius:13px;padding:4px}
  .mnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;padding:6px;border-radius:24px;background:rgba(20,24,20,.72);border:1px solid var(--line-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:18px;color:var(--muted);font-size:11px;font-weight:700;transition:background .25s,color .25s}
  .mnav a.on{background:var(--lime-soft);color:var(--text)}
  .mnav a{padding:10px 4px 9px;font-size:11.5px}
  .mnav a:active{transform:scale(.95)}
  .mnav .nicon img{filter:grayscale(1) brightness(1.5);opacity:.55}
  .mnav a.on .nicon img{filter:none;opacity:1}
  .mnav a.on .nicon svg{stroke:var(--lime)}
  .page-head{margin-bottom:18px}
  .dash{gap:12px}
  .now{padding:20px;min-height:0;gap:18px}
  .now .tag{display:none}
  .clock .t{font-size:clamp(64px,22vw,96px)}
  .ringcard{padding:18px;gap:18px}
  .quote{padding:18px;gap:14px}
  .quote .qm{font-size:48px;padding-top:14px}
  .quote .qtext{font-size:18px}
  .ring{width:124px;height:124px}
  .ring .lbl b{font-size:30px}
  .ringcard .side .btn{display:none}
  .stat{grid-column:span 6;padding:16px}
  .stat .v{font-size:26px}
  .panel{padding:18px}
  .qgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .qtile img{width:32px;height:32px}
  .qtile span{font-size:11px}
  .parts{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .part{padding:14px;gap:12px;border-radius:22px}
  .part .meta .h2{font-size:17px}
  .part .meta .check{display:none}
  .part .idx{top:12px;left:14px}
  .sections{grid-template-columns:1fr;gap:12px}
  .sec{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:14px;padding:12px}
  .sec .ph,.sec .media{border-radius:14px}
  .sec .bodyc{display:flex;flex-direction:column;gap:8px}
  .part-hero .pi{width:60px;height:60px;border-radius:18px}
  .part-hero .pi img{width:40px;height:40px}
  .ex,.walk{grid-template-columns:1fr;padding:12px;gap:18px}
  .ex-info,.walk-info{padding:0 4px 6px}
  .media,.ph{border-radius:16px}
  .fields{gap:10px}
  .inp{height:56px}
  .walk .inp .unit{display:none}
  .walk .field label .lunit{display:inline}
  .inp .step{width:40px}
  .inp input{padding:0 10px;text-align:center}
  .pstats{gap:10px}
  .pstat{padding:14px 16px}
  .pstat .v{font-size:24px}
  .modal{place-items:end center;padding:0}
  .modal .sheet{width:100%;border-radius:26px 26px 0 0;max-height:88vh;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:sheet .4s var(--ease) both}
  @keyframes sheet{from{transform:translateY(40px);opacity:0}}
  .pill{right:50%;transform:translateX(50%);bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){.fields{grid-template-columns:1fr}.walk .fields{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (hover:none){.part:hover,.sec:hover,.qtile:hover{transform:none}}
</style>

/* =====================================================================
   EXERCISE & MACHINE IMAGES — empty slots until real images arrive.
   To add one, paste an image URL or data: URI against its slot id.
   Any size works; the UI shows it as a 1:1 tile with object-fit (no distortion).
   ===================================================================== */
const EXERCISE_IMAGES = {
  "chest-upper": "", "chest-mid": "", "chest-lower": "",
  "shoulder": "",
  "bicep-upper": "", "bicep-mid": "", "bicep-lower": "",
  "triceps-upper": "", "triceps-mid": "", "triceps-lower": "",
  "back": "", "legs": "", "belly": "",
  "treadmill": ASSETS.treadmill   // provided: treadmill photo
};

/* =====================================================================
   PROGRAM — Body part → Section → Exercise. Data only; the UI reads it.
   Exercise names are null until provided (no invented exercises).
   Add a section:   { id:"x", name:"…", short:"…", exercises:[slot("part-x")] }
   Add an exercise: push another slot("id", { name:"…", track:"reps"|"time"|"both" })
   ===================================================================== */
function slot(id, o = {}) {
  return { id, name: null, icon: null, track: "both", fit: "cover", ...o, get image() { return EXERCISE_IMAGES[id] || ""; } };
}
const PROGRAM = [
  { id: "chest", name: "Chest", icon: "chest", sections: [
      { id: "upper", name: "Upper Chest", short: "Upper", exercises: [slot("chest-upper")] },
      { id: "mid",   name: "Mid Chest",   short: "Mid",   exercises: [slot("chest-mid")] },
      { id: "lower", name: "Lower Chest", short: "Lower", exercises: [slot("chest-lower")] } ] },
  { id: "shoulder", name: "Shoulder", icon: "shoulder", sections: [
      { id: "main", name: "Shoulder", implicit: true, exercises: [slot("shoulder")] } ] },
  { id: "bicep", name: "Bicep", icon: "bicep", sections: [
      { id: "upper", name: "Upper Bicep", short: "Upper", exercises: [slot("bicep-upper")] },
      { id: "mid",   name: "Mid Bicep",   short: "Mid",   exercises: [slot("bicep-mid")] },
      { id: "lower", name: "Lower Bicep", short: "Lower", exercises: [slot("bicep-lower")] } ] },
  { id: "triceps", name: "Triceps", icon: "triceps", sections: [
      { id: "upper", name: "Upper Triceps", short: "Upper", exercises: [slot("triceps-upper")] },
      { id: "mid",   name: "Mid Triceps",   short: "Mid",   exercises: [slot("triceps-mid")] },
      { id: "lower", name: "Lower Triceps", short: "Lower", exercises: [slot("triceps-lower")] } ] },
  { id: "back",  name: "Back",  icon: "back",  sections: [ { id: "main", name: "Back",  implicit: true, exercises: [slot("back")] } ] },
  { id: "legs",  name: "Legs",  icon: "legs",  sections: [ { id: "main", name: "Legs",  implicit: true, exercises: [slot("legs")] } ] },
  { id: "belly", name: "Belly", icon: "belly", sections: [ { id: "main", name: "Belly", implicit: true, exercises: [slot("belly")] } ] },
  { id: "walk",  name: "Walk",  icon: "walk",  type: "walk", imageKey: "treadmill" }
];

const APP = { name: "Awais Gym", short: "Gym", user: "Awais" };

/* ---------- derived ---------- */
const STRENGTH = PROGRAM.filter(p => p.type !== "walk");
const ALL_EX = STRENGTH.flatMap(p => p.sections.flatMap(s => s.exercises.map(ex => ({ ex, part: p, section: s }))));
const HAS_WALK = PROGRAM.some(p => p.type === "walk");
const icon = k => ASSETS.icons[k] || "";

/* ---------- storage ---------- */
const STORE_KEY = "awais-gym.v1";
let S = { version: 1, days: {}, timer: null };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const fmtInt = n => Math.round(n).toLocaleString("en-US");
function hms(sec) { sec = Math.max(0, Math.round(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return `${pad(h)}:${pad(m)}:${pad(s)}`; }
function shortDur(sec) { sec = Math.round(sec || 0); if (!sec) return "0 min"; const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60); return h ? `${h} h ${pad(m)} min` : `${Math.max(1, m)} min`; }
function parseDur(str) { // "15" = 15 min · "15:30" = mm:ss · "1:15:30" = h:mm:ss
  str = String(str || "").trim(); if (!str) return 0;
  if (!str.includes(":")) return Math.round(num(str) * 60);
  const p = str.split(":").map(x => num(x)); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
}
function peek(k) { return S.days[k] || { ex: {}, walk: {} }; }
function touch(k) { return S.days[k] || (S.days[k] = { ex: {}, walk: {} }); }
function exData(id, k = dkey()) { return peek(k).ex[id] || {}; }
function setEx(id, patch, k = dkey()) { const d = touch(k); d.ex[id] = { ...(d.ex[id] || {}), ...patch }; persist(); }
function setWalk(patch, k = dkey()) { const d = touch(k); d.walk = { ...(d.walk || {}), ...patch }; persist(); }
const hasData = e => !!(e && (e.done || e.dur || e.sets || e.reps || (e.notes && e.notes.trim())));
const walkHas = w => !!(w && (w.done || num(w.dur) || num(w.incline) || num(w.speed) || num(w.cal) || num(w.steps)));

function dayStats(k) {
  const d = peek(k); let done = 0, dur = 0, missed = 0; const touched = [];
  for (const p of STRENGTH) {
    const items = p.sections.flatMap(s => s.exercises); let any = false, pd = 0;
    for (const ex of items) { const e = d.ex[ex.id]; if (e) { if (e.done) { done++; pd++; } dur += e.dur || 0; if (hasData(e)) any = true; } }
    if (any) { touched.push(p); missed += items.length - pd; }
  }
  const w = d.walk || {};
  if (w.done) done++;
  if (walkHas(w) && !w.done) missed++;
  dur += num(w.dur) * 60;
  const total = ALL_EX.length + (HAS_WALK ? 1 : 0);
  return { done, total, remaining: total - done, dur, walk: w, touched, missed, walkActive: walkHas(w) };
}
function partProgress(p, k = dkey()) {
  if (p.type === "walk") { const w = peek(k).walk || {}; return { done: w.done ? 1 : 0, total: 1 }; }
  const items = p.sections.flatMap(s => s.exercises);
  return { done: items.filter(ex => exData(ex.id, k).done).length, total: items.length };
}

/* ---------- timer (one at a time, survives refresh) ---------- */
function timerElapsed(t = S.timer) { return t ? t.base + (Date.now() - t.start) / 1000 : 0; }
function timerStart(id) {
  if (S.timer && S.timer.id === id) return;
  if (S.timer) timerStop();
  S.timer = { id, k: dkey(), base: exData(id).dur || 0, start: Date.now() }; persist();
}
function timerStop() { const t = S.timer; if (!t) return; setEx(t.id, { dur: Math.round(timerElapsed(t)) }, t.k); S.timer = null; persist(); }

const QUOTE_MS = 30000;

function QuoteCard() {
  shownQuote = quoteIndex();

  return `<section class="glass quote" aria-live="polite"><span class="qm" aria-hidden="true">“</span><div class="qbody">

function rotateQuote() {
  const el = document.querySelector("[data-quote]"); if (!el) return;
  const i = quoteIndex(); if (i === shownQuote) return; shownQuote = i;
  el.classList.add("out");
  setTimeout(() => {
    el.textContent = QUOTES[i]; el.classList.remove("out"); el.classList.add("pre");
    void el.offsetWidth; el.classList.remove("pre");
    const n = document.querySelector("[data-qnum]"); if (n) n.textContent = `${pad(i + 1)} / ${QUOTES.length}`;
    const l = document.querySelector("[data-qline]"); if (l) { l.style.animation = "none"; void l.offsetWidth; l.style.animation = ""; l.style.animationDelay = "0s"; }

/* =====================================================================
   INSTALL — uses the browser's real install prompt when it offers one,
   otherwise shows manual steps. Hidden once the app runs installed.
   ===================================================================== */
let deferredPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isHosted = () => location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname);
let installedFlag = false;
try { installedFlag = localStorage.getItem("awais-gym.installed") === "1"; } catch (e) {}
function InstallButton(where) {
  if (isStandalone()) return where === "top" ? "<span></span>" : "";
  const label = deferredPrompt ? "Install app" : "Install";
  return `<button class="install ${where === "side" ? "side-install" : ""}" data-act="install" data-install><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">${label}</span></button>`;
}
function refreshInstall() { document.querySelectorAll("[data-install]").forEach(b => { if (isStandalone()) b.remove(); else { const l = b.querySelector(".lbl"); if (l) l.textContent = deferredPrompt ? "Install app" : "Install"; } }); }
async function doInstall() {
  if (deferredPrompt) {
    const p = deferredPrompt; deferredPrompt = null;
    p.prompt();
    const { outcome } = await p.userChoice;
    if (outcome === "accepted") toast("Installing… look for the app on your home screen");
    else toast("Install cancelled");
    refreshInstall(); return;
  }
  showInstallHelp();
}
function showInstallHelp() {
  const close = `<button class="xbtn" data-act="mclose" aria-label="Close">${SVG.x}</button>`;
  let body;
  if (isHosted() && installedFlag) {
    body = `<p class="muted" style="margin:0">The app is already installed on this device. Open it from your home screen or app drawer.</p>`;
  } else if (!isHosted()) {
    body = `<p class="muted" style="margin:0 0 16px">This copy is opened as a file on your device${location.protocol === "file:" ? "" : " (it starts with “content://” or “file://”)"}. Phones only install apps that are opened from a secure website address (https://).</p>
      <ol class="steps"><li><span>Upload the app folder (index.html, manifest, sw.js and icons) to a free HTTPS host such as GitHub Pages or Netlify.</span></li><li><span>Open that https:// link in Chrome on your phone.</span></li><li><span>Tap <b>Install app</b> here, or open the Chrome menu <b>⋮</b> and choose <b>Install app</b> / <b>Add to Home screen</b>.</span></li></ol>
      <div class="note">Your workout data is saved per browser address, so data logged in this file copy will not move to the installed app automatically.</div>`;
  } else if (isIOS()) {
    body = `<ol class="steps"><li><span>Open this page in <b>Safari</b>.</span></li><li><span>Tap the <b>Share</b> button (square with an arrow).</span></li><li><span>Choose <b>Add to Home Screen</b>, then tap <b>Add</b>.</span></li></ol>`;
  } else {
    body = `<p class="muted" style="margin:0 0 16px">Your browser has not offered its install prompt yet.</p>
      <ol class="steps"><li><span>Open your browser menu (<b>⋮</b> in Chrome).</span></li><li><span>Select <b>Install app</b> or <b>Add to Home screen</b>.</span></li><li><span>Confirm. The app opens full screen from your home screen.</span></li></ol>
      <div class="note">If neither option appears, open the page in <b>Chrome</b> or <b>Edge</b> and reload once so the app can finish setting up.</div>`;
  }
  Modal(`<div class="mhead"><div><div class="eyebrow">Install</div><div class="h2">Add the app to your phone</div></div>${close}</div>${body}`);
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; installedFlag = false; try { localStorage.removeItem("awais-gym.installed"); } catch (x) {} refreshInstall(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; installedFlag = true; try { localStorage.setItem("awais-gym.installed", "1"); } catch (e) {} toast("App installed"); refreshInstall(); });

function durParts(sec) { sec = Math.round(sec || 0); if (sec >= 3600) return { v: `${Math.floor(sec / 3600)}:${pad(Math.floor(sec % 3600 / 60))}`, unit: "h" }; return { v: String(Math.floor(sec / 60)), unit: "min" }; }
function liveTotal() { const k = dkey(); let t = dayStats(k).dur; if (S.timer && S.timer.k === k) t += timerElapsed() - (exData(S.timer.id, k).dur || 0); return t; }

  <div class="dash stagger">

    ${QuoteCard()}
    ${DashboardCard("ringcard", `<div class="ring"><svg viewBox="0 0 160 160"><circle class="trk" cx="80" cy="80" r="70"/><circle class="val" cx="80" cy="80" r="70" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - pct)}"/></svg>
      <div class="lbl"><b class="num">${Math.round(pct * 100)}%</b><span>today</span></div></div>
      <div class="side"><div class="eyebrow">Today's progress</div><div class="h2">${st.done} of ${st.total} done</div><p>${st.done ? (st.remaining ? `${st.remaining} still open across your program.` : "Every exercise in the program is done.") : "Nothing logged yet. Pick a body part to begin."}</p><a class="btn lime sm" href="#program" style="align-self:flex-start">Open program ${SVG.next}</a></div>`)}
    ${StatTile({ ico: SVG.done, v: st.done, k: "Completed" })}
    ${StatTile({ ico: `<img src="${ASSETS.ui.dashboard}" alt="">`, v: st.remaining, k: "Remaining" })}
    ${StatTile({ ico: `<img src="${ASSETS.ui.time}" alt="">`, v: `<span data-live-total>${durParts(liveTotal()).v}</span>`, unit: `<span data-live-unit>${durParts(liveTotal()).unit}</span>`, k: "Workout time" })}
    ${StatTile({ ico: `<img src="${icon("walk")}" alt="">`, v: num(w.dur) ? fmtInt(num(w.dur)) : "0", unit: "min", k: num(w.steps) ? `Walk · ${fmtInt(num(w.steps))} steps` : "Walk" })}
    ${DashboardCard("panel activity", `<div class="panel-head"><div class="eyebrow">Today's activity</div></div>
      ${feed.length || walkHas(w) ? `<div class="feed">${walkHas(w) ? `<a class="feed-row" href="#program/walk"><span class="fi"><img src="${icon("walk")}" alt=""></span><span class="ft"><b>Treadmill walk</b><span>${[num(w.dur) && `${w.dur} min`, num(w.speed) && `${w.speed} km/h`, num(w.incline) && `${w.incline}% incline`].filter(Boolean).join(" · ") || "Logged"}</span></span><span class="fv">${w.done ? '<span class="chip done"><span class="dot"></span>Done</span>' : '<span class="chip">Open</span>'}</span></a>` : ""}
        ${feed.slice(0, 6).map(({ it, e }) => `<a class="feed-row" href="#program/${it.part.id}/${it.section.id}"><span class="fi"><img src="${icon(it.part.icon)}" alt=""></span><span class="ft"><b>${esc(it.ex.name || (it.section.implicit ? it.part.name : it.section.name))}</b><span>${[e.dur && hms(e.dur), e.sets && `${e.sets} sets`, e.reps && `${e.reps} reps`].filter(Boolean).join(" · ") || "Logged"}</span></span><span class="fv">${e.done ? '<span class="chip done"><span class="dot"></span>Done</span>' : '<span class="chip">Open</span>'}</span></a>`).join("")}</div>`

    ${DashboardCard("panel quick", `<div class="panel-head"><div class="eyebrow">Quick access</div><a class="muted" href="#program" style="font-size:13px;font-weight:700">All</a></div>

  </div></div>`;

      return `<a class="sec" href="#program/${p.id}/${s.id}">
        ${ExerciseImage({ src: ex.image, alt: s.name, iconKey: p.icon, fit: ex.fit, size: "sm" })}
        <div class="bodyc" style="display:flex;flex-direction:column;gap:8px"><div class="row"><span class="pos">${esc(s.short || s.name)}</span>${Check(done)}</div>
        <div class="sub">${esc(s.name)} · ${s.exercises.length} exercise${s.exercises.length > 1 ? "s" : ""}</div>
        <div><span class="chip ${done ? "done" : ""}"><span class="dot"></span>${done ? "Completed" : any ? "In progress" : "Not completed"}</span></div></div></a>`;
    }).join("")}</div></div>`;
}

function PageSection(p, s) {
  const i = p.sections.indexOf(s), prev = p.sections[i - 1], next = p.sections[i + 1];
  const crumbs = s.implicit ? `<a href="#program">Program</a><span class="sep">/</span><span>${esc(p.name)}</span>`
    : `<a href="#program">Program</a><span class="sep">/</span><a href="#program/${p.id}">${esc(p.name)}</a><span class="sep">/</span><span>${esc(s.short || s.name)}</span>`;
  return `<div class="page"><div class="crumbs">${crumbs}</div>
    <div class="grid stagger">${s.exercises.map(ex => ExerciseCard({ ex, part: p, section: s })).join("")}</div>
    ${s.implicit ? "" : `<div class="ex-nav">${prev ? `<a class="btn" href="#program/${p.id}/${prev.id}">${SVG.back}${esc(prev.name)}</a>` : "<span></span>"}${next ? `<a class="btn" href="#program/${p.id}/${next.id}">${esc(next.name)}${SVG.next}</a>` : `<a class="btn" href="#program">Back to program</a>`}</div>`}</div>`;
}

function PageWalk(p) {
  return `<div class="page"><div class="crumbs"><a href="#program">Program</a><span class="sep">/</span><span>Walk</span></div>${WalkTracker(p)}</div>`;
}

let RANGE = "7";
function PageProgress() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const allKeys = Object.keys(S.days).sort();
  let days = RANGE === "all" ? (allKeys.length ? Math.max(1, Math.round((today - fromKey(allKeys[0])) / 864e5) + 1) : 7) : +RANGE;
  const keys = []; for (let i = days - 1; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); keys.push(dkey(d)); }
  let done = 0, missed = 0, dur = 0, wmin = 0, steps = 0, cal = 0, active = 0; const byPart = {};
  const series = keys.map(k => { const st = dayStats(k); done += st.done; missed += st.missed; dur += st.dur; wmin += num(st.walk.dur); steps += num(st.walk.steps); cal += num(st.walk.cal); if (st.touched.length || st.walkActive) active++;
    for (const p of PROGRAM) { const pr = partProgress(p, k); byPart[p.id] = (byPart[p.id] || 0) + pr.done; } return { k, min: st.dur / 60 }; });
  const pct = done + missed ? Math.round(done / (done + missed) * 100) : 0;
  const chartDays = series.slice(-Math.min(series.length, 30));
  const maxPart = Math.max(1, ...Object.values(byPart));
  return `<div class="page"><div class="page-head"><div><div class="eyebrow">Progress</div><h1 class="h1">Your numbers</h1><p>${active} active day${active === 1 ? "" : "s"} in ${RANGE === "all" ? "total" : `the last ${days} days`}.</p></div>
    <div class="seg" role="tablist">${[["7", "7 days"], ["30", "30 days"], ["all", "All time"]].map(([v, l]) => `<button class="${RANGE === v ? "on" : ""}" data-act="range" data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="pstats stagger">
      ${ProgressCard({ v: pct, unit: "%", k: "Completion rate", feature: true })}
      ${ProgressCard({ v: done, k: "Exercises completed" })}
      ${ProgressCard({ v: missed, k: "Not completed" })}
      ${ProgressCard({ v: (dur / 3600).toFixed(dur >= 36000 ? 0 : 1), unit: "h", k: "Total workout time" })}
      ${ProgressCard({ v: fmtInt(wmin), unit: "min", k: "Walking time" })}
      ${ProgressCard({ v: fmtInt(steps), k: "Total steps" })}
      ${ProgressCard({ v: fmtInt(cal), unit: "kcal", k: "Calories burned" })}
      ${ProgressCard({ v: active, k: "Active days" })}
    </div>
    <div class="pcharts stagger">
      <section class="glass panel"><div class="panel-head"><div class="eyebrow">Workout minutes per day</div><div class="legend">${chartDays.length < series.length ? "Last 30 days" : ""}</div></div>${BarChart(chartDays)}</section>
      <section class="glass panel"><div class="panel-head"><div class="eyebrow">Completions by body part</div></div>
        <div class="hbars">${PROGRAM.map(p => `<div class="hbar"><div class="top"><span class="l"><img src="${icon(p.icon)}" alt="">${esc(p.name)}</span><span>${byPart[p.id] || 0}</span></div>${Bar((byPart[p.id] || 0) / maxPart)}</div>`).join("")}</div></section>
    </div></div>`;
}
function BarChart(data) {
  const W = 640, H = 240, L = 34, B = 26, T = 10, R = 6, iw = W - L - R, ih = H - T - B;
  const max = Math.max(...data.map(d => d.min)); const top = max <= 0 ? 60 : Math.ceil(max / 15) * 15;
  const ticks = [0, top / 3, 2 * top / 3, top].map(v => Math.round(v));
  const bw = iw / data.length, gap = Math.min(10, bw * .3);
  const every = Math.ceil(data.length / 8);
  const todayK = dkey();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of workout minutes per day">
    <g class="grid">${ticks.map(t => { const y = T + ih - t / top * ih; return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${t}</text>`; }).join("")}</g>
    ${data.map((d, i) => { const h = d.min / top * ih, x = L + i * bw + gap / 2, w = bw - gap, dt = fromKey(d.k);
      const lab = i % every === 0 || i === data.length - 1 ? `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" ${d.k === todayK ? 'style="fill:var(--text)"' : ""}>${data.length <= 7 ? dt.toLocaleDateString("en-US", { weekday: "short" }) : dt.getDate()}</text>` : "";
      return `${d.min > 0 ? `<rect class="b" x="${x}" y="${T + ih - h}" width="${w}" height="${Math.max(h, 2)}" rx="${Math.min(6, w / 2)}"/>` : `<rect class="b0" x="${x}" y="${T + ih - 3}" width="${w}" height="3" rx="1.5"/>`}
      <rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" data-tip="${dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })} · ${Math.round(d.min)} min"/>${lab}`; }).join("")}
  </svg>`;
}

/* =====================================================================
   ROUTER + RENDER
   ===================================================================== */
function route() { const h = (location.hash || "#dashboard").slice(1).split("/").filter(Boolean); return h.length ? h : ["dashboard"]; }
function render() {
  const r = route(), top = r[0];
  let html;
  if (top === "program") {
    const p = PROGRAM.find(x => x.id === r[1]);
    if (!p) html = PageProgram();
    else if (p.type === "walk") html = PageWalk(p);
    else if (p.sections.length === 1 && p.sections[0].implicit) html = PageSection(p, p.sections[0]);
    else { const s = p.sections.find(x => x.id === r[2]); html = s ? PageSection(p, s) : PagePart(p); }
  } else if (top === "progress") html = PageProgress();
  else html = PageDashboard();
  const navId = NAV.some(n => n.id === top) ? top : "dashboard";
  document.getElementById("sidebar").innerHTML = Navigation(navId);
  document.getElementById("mnav").innerHTML = MobileNavigation(navId);
  document.getElementById("mtop").innerHTML = MobileTop();
  document.getElementById("view").innerHTML = html;
  renderPill();
  tick();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w);
    document.querySelectorAll("[data-off]").forEach(el => el.style.strokeDashoffset = el.dataset.off);
  }));
}
function renderPill() {
  let pill = document.getElementById("pill");
  const onPage = S.timer && document.querySelector(`[data-timer="${S.timer.id}"]`);
  if (!S.timer || onPage) { if (pill) pill.remove(); return; }
  const it = findEx(S.timer.id); if (!it) { S.timer = null; persist(); return; }
  if (!pill) { pill = document.createElement("a"); pill.id = "pill"; pill.className = "pill"; document.body.appendChild(pill); }
  pill.href = `#program/${it.part.id}/${it.section.id}`;
  pill.innerHTML = `<i></i><span>${esc(it.section.implicit ? it.part.name : it.section.name)}</span><span class="num" data-timer="${S.timer.id}">${hms(timerElapsed())}</span>`;
}

/* real-time clock from device time */
let lastDay = dkey();
function tick() {
  const n = new Date();
  if (dkey(n) !== lastDay) { lastDay = dkey(n); render(); return; }
  const h12 = n.getHours() % 12 || 12, mm = pad(n.getMinutes()), ap = n.getHours() < 12 ? "AM" : "PM";
  const set = (sel, v) => document.querySelectorAll(`[data-clock="${sel}"]`).forEach(el => { if (el.textContent !== v) el.textContent = v; });
  set("time", `${h12}:${mm}`); set("ampm", ap); set("sec", `:${pad(n.getSeconds())}`);
  set("weekday", n.toLocaleDateString("en-US", { weekday: "long" }) + ",");
  set("date", n.toLocaleDateString("en-US", { month: "long", day: "numeric" }));
  if (S.timer) document.querySelectorAll(`[data-timer="${S.timer.id}"]`).forEach(el => el.textContent = hms(timerElapsed()));
  rotateQuote();
  const lt = document.querySelector("[data-live-total]");
  if (lt) { const p = durParts(liveTotal()); lt.textContent = p.v; const u = document.querySelector("[data-live-unit]"); if (u) u.textContent = p.unit; }
}
setInterval(tick, 1000);

/* ---------- events ---------- */
let savedT = {};
function flashSaved(id) { const el = document.querySelector(`[data-saved="${id}"]`); if (!el) return; el.style.opacity = 1; clearTimeout(savedT[id]); savedT[id] = setTimeout(() => el.style.opacity = 0, 1400); }

function refreshComplete(id, on) {
  const b = document.querySelector(`.complete[data-id="${id}"]`); if (!b) return;
  b.outerHTML = CompletionButton(id, on);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "mclose") { if (e.target === t || t.classList.contains("xbtn")) closeModal(); return; }
  if (a === "toggle") {
    if (id === "walk") { const on = !peek(dkey()).walk?.done; setWalk({ done: on, doneAt: on ? Date.now() : null }); refreshComplete(id, on); toast(on ? "Walk marked as completed" : "Walk marked as not completed"); }
    else { const on = !exData(id).done; setEx(id, { done: on, doneAt: on ? Date.now() : null }); refreshComplete(id, on); toast(on ? "Marked as completed" : "Marked as not completed"); }
    return;
  }
  if (a === "tstart") { timerStart(id); rerenderTimer(id); return; }
  if (a === "tstop") { timerStop(); rerenderTimer(id); flashSaved(id); return; }
  if (a === "treset") { if (S.timer && S.timer.id === id) { S.timer = null; } setEx(id, { dur: 0 }); rerenderTimer(id); flashSaved(id); return; }
  if (a === "step") {
    const f = t.dataset.f, inp = document.getElementById(`f-${id}-${f}`); const d = parseFloat(t.dataset.d);
    const v = Math.max(0, Math.round((num(inp.value) + d) * 10) / 10); inp.value = v || "";
    commitField(id, f, inp.value); return;
  }
  if (a === "install") { doInstall(); return; }
  if (a === "walksave") { flashSaved("walk"); toast("Walk saved"); return; }
  if (a === "range") { RANGE = t.dataset.v; render(); return; }
});
function rerenderTimer(id) {
  const box = document.querySelector(`[data-timerbox="${id}"]`); if (box) box.outerHTML = WorkoutTimer(id);
  const inp = document.getElementById(`f-${id}-dur`); if (inp) { const run = S.timer && S.timer.id === id; inp.disabled = !!run; const d = exData(id).dur; inp.value = !run && d ? hms(d) : ""; }
  renderPill();
}
function commitField(id, f, val) {
  if (id === "walk") { setWalk({ [f]: val.trim() }); }
  else if (f === "dur") { setEx(id, { dur: parseDur(val) }); const box = document.querySelector(`[data-timer="${id}"]`); if (box) box.textContent = hms(exData(id).dur); }
  else if (f === "notes") setEx(id, { notes: val });
  else setEx(id, { [f]: val.trim() ? Math.max(0, Math.round(num(val))) : "" });
  flashSaved(id);
}
let inT;
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.f === "dur" && el.dataset.id !== "walk") return; // commit on change so partial "1:" isn't parsed
  clearTimeout(inT); inT = setTimeout(() => commitField(el.dataset.id, el.dataset.f, el.value), 350);
});
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  clearTimeout(inT); commitField(el.dataset.id, el.dataset.f, el.value);
  if (el.dataset.f === "dur" && el.dataset.id !== "walk") { const d = exData(el.dataset.id).dur; el.value = d ? hms(d) : ""; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); if (e.key === "Enter" && e.target.matches(".inp input")) e.target.blur(); });
/* chart tooltip */
let tipEl;
document.addEventListener("pointerover", e => { const h = e.target.closest && e.target.closest("[data-tip]"); if (!h) { if (tipEl) tipEl.remove(), tipEl = null; return; }
  if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
  const r = h.getBoundingClientRect(); tipEl.textContent = h.dataset.tip; tipEl.style.left = r.left + r.width / 2 + "px"; tipEl.style.top = r.top + r.height * .35 + "px"; });
window.addEventListener("hashchange", () => { closeModal(); render(); window.scrollTo({ top: 0 }); });
window.addEventListener("storage", e => { if (e.key === STORE_KEY) { try { S = Object.assign({ days: {}, timer: null }, JSON.parse(e.newValue)); render(); } catch (x) {} } });

/* =====================================================================
   INSTALLABLE APP (PWA) — manifest generated from the embedded app icon.
   If a manifest.webmanifest file sits next to this page (hosted kit), that one is used.
   ===================================================================== */
(function pwa() {
  const base = location.href.split("#")[0];
  const manifest = {
    id: base, name: APP.name, short_name: APP.short, description: "Personal gym program and workout tracker",
    start_url: base, scope: base.replace(/[^/]*$/, ""), display: "standalone", orientation: "any",
    background_color: "#0B0D0B", theme_color: "#0B0D0B",
    icons: [ { src: ASSETS.appIcon192, sizes: "192x192", type: "image/png", purpose: "any" },
             { src: ASSETS.appIcon512, sizes: "512x512", type: "image/png", purpose: "any" },
             { src: ASSETS.appIconMask512, sizes: "512x512", type: "image/png", purpose: "maskable" } ]
  };
  document.getElementById("faviconLink").href = ASSETS.appIcon192;
  document.getElementById("touchIconLink").href = ASSETS.appIcon192;
  const link = document.getElementById("manifestLink");
  const hosted = /^https?:/.test(location.protocol) && window.__HOSTED_KIT__;
  link.href = hosted ? "manifest.webmanifest" : "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
  if (hosted && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();

render();
</script>
